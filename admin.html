<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物料维护｜丽兹行感恩连接行动包</title><link rel="stylesheet" href="style.css?v=20261030-sales"><style>main{max-width:850px;margin:40px auto;padding:20px}.admin-box{background:#fff;border:1px solid #e5dff1;border-radius:22px;padding:28px;margin:20px 0}label{display:block;font-weight:650;margin:16px 0 6px}input,select,button{font:inherit;padding:11px 14px;max-width:100%;border:1px solid #d7cee6;border-radius:10px}input:not([type=file]){width:100%}button{background:#74549a;color:white;cursor:pointer}#status{color:#5d427f;min-height:24px}#files article{padding:14px 0;border-bottom:1px solid #eee}small{color:#686070;display:block;margin:5px 0}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#6d478f}#logout{background:#fff;color:#604482}p{line-height:1.6}</style>
<main><header><h1>物料维护</h1><a href="./">返回行动包 ↗</a></header><p>由项目组统一上传发布，销售中心从固定链接取用最新资料。</p><p id="status" role="status"></p>
<section class="admin-box" id="login"><h2>管理员登录</h2><p>输入管理密码后，即可选择本地文件上传和维护资料。</p><form id="login-form"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required><p><button id="login-button">进入管理</button></p></form><small id="setup"></small></section>
<section class="admin-box" id="panel" hidden><header><h2>上传专业物料</h2><button id="logout">退出管理</button></header><form id="upload-form"><label for="category">分类</label><select id="category" name="category"><option value="hmall">hmall图</option><option value="market">市场报告</option><option value="other">补充物料</option></select><label for="title">资料标题</label><input id="title" name="title" maxlength="80" placeholder="例如：11月hmall图" required><label for="source">内容来源（选填）</label><input id="source" name="source" maxlength="120" value="项目组" placeholder="默认项目组"><label for="date">资料日期</label><input id="date" type="date" name="date" required><label for="file">选择本地文件</label><input id="file" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.docx,.pptx" required><small>支持图片、PDF、Word、Excel、PPTX，单个文件不超过20MB。hmall图新文件发布后，旧版自动停止在公共资料区展示。</small><p><button id="upload">上传并发布</button></p></form><h2>已上传资料</h2><div id="files"></div></section>
</main><script src="backend-config.js?v=20261030-sales"></script><script src="supabase-adapter.js?v=20261030-sales"></script><script>
const $=id=>document.getElementById(id),status=message=>$('status').textContent=message;
async function api(url,options){const response=await fetch(url,options);const result=await response.json();if(!response.ok){if(response.status===401){$('login').hidden=false;$('panel').hidden=true;}throw Error(result.error||'操作未完成');}return result;}
async function refresh(){try{if(!window.GRATITUDE_SUPABASE_ENABLED&&(location.hostname.endsWith('github.io')||location.protocol==='file:')){$('login-form').hidden=true;$('panel').hidden=true;$('setup').textContent='共享资料上传尚待接入管理服务。接通后，可在此选择本地文件上传。';status('共享资料区待接入');return;}const s=await api('/api/admin/session');$('login').hidden=s.authenticated;$('panel').hidden=!s.authenticated;$('setup').textContent=s.configured?'':'管理服务尚未接通，请稍后重试。';if(s.authenticated){const d=await api('/api/admin/materials');$('files').replaceChildren();if(!d.materials.length)$('files').textContent='尚未上传资料。';for(const item of d.materials.slice().reverse()){const row=document.createElement('article'),title=document.createElement('strong'),meta=document.createElement('small'),button=document.createElement('button');title.textContent=item.title;meta.textContent=[item.date,item.source||'项目组',item.active?'已发布':'已下架',Math.ceil(item.size/1024)+' KB'].filter(Boolean).join(' · ');button.textContent=item.active?'下架':'重新发布';button.onclick=async()=>{try{await api('/api/admin/materials/'+item.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({active:!item.active})});status('资料状态已更新');await refresh();}catch(e){status(e.message);}};row.append(title,meta,button);$('files').append(row);}}}catch(e){status(e.message||'管理入口暂未连接，请稍后重试。');}}
$('date').value=new Date().toISOString().slice(0,10);
$('login-form').onsubmit=async e=>{e.preventDefault();$('login-button').disabled=true;try{await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('password').value})});status('已进入管理，可以选择本地文件上传。');await refresh();}catch(error){status(error.message);}finally{$('password').value='';$('login-button').disabled=false;}};
$('upload-form').onsubmit=async e=>{e.preventDefault();const file=$('file').files[0];if(!file||file.size<=0||file.size>20*1024*1024)return status('请选择20MB以内的非空文件');$('upload').disabled=true;status('正在上传，请保持页面打开…');try{await api('/api/admin/materials',{method:'POST',body:new FormData(e.target)});status('上传成功，行动包资料区现可下载最新文件。');e.target.reset();$('date').value=new Date().toISOString().slice(0,10);await refresh();}catch(error){status(error.message);}finally{$('upload').disabled=false;}};
$('logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'});}catch{}await refresh();status('已退出管理');};refresh();
</script></html>
